[project]
name = "statxo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gauravgulia26", email = "grvgulia007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-typesafe>=0.0.1a3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
statxo = "statxo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
]
